[package]
name = "soundcore"
version = "0.1.0"
description = "SoundCore - controlador de soundbar"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soundcore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Bluetooth", "Win32_System_Memory"] }
lofty = "0.25.0"
base64 = "0.22"
walkdir = "2.5.0"
rodio = "0.22.2"
tauri-plugin-dialog = "2.7.2"
cpal = "0.17"
rustfft = "6.4.1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "fs"] }
futures-util = "0.3"
qrcode = { version = "0.14", features = ["svg"] }
rand = "0.8"
local-ip-address = "0.6"
hidapi = "2.6"

[profile.dev]
# Reduce disk usage on constrained machines; strips full debuginfo.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
